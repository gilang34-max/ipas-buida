<script>
var BAB1 = {
  no: 1,
  judul: "Makhluk Hidup dan Lingkungan",
  desk: "Mengenali ciri makhluk hidup, ekosistem, rantai makanan, dan cara menjaga bumi tetap seimbang.",
  subs: [
    {
      t: "Ciri-ciri Makhluk Hidup",
      c: `<p>Coba lihat sekelilingmu. Ada ayam yang berkokok di halaman, pohon mangga di depan rumah, dan jamur kecil yang tumbuh di batang kayu lapuk. Semuanya hidup. Di sisi lain ada batu, meja, dan sepeda yang tidak hidup. Bagaimana kita bisa memastikan sebuah benda hidup atau tidak? Para ilmuwan memeriksa apakah benda itu memiliki ciri-ciri makhluk hidup. Ciri-ciri ini dimiliki semua makhluk hidup, dari semut yang sangat kecil sampai pohon beringin yang sangat besar.</p>
<p>Ciri pertama adalah {{bernapas}}. Bernapas membantu makhluk hidup mengambil oksigen dan mengeluarkan karbon dioksida. Manusia dan hewan darat bernapas dengan paru-paru, ikan dengan insang, dan cacing tanah dengan permukaan kulitnya yang lembap. Tumbuhan bernapas lewat lubang-lubang kecil di daun yang disebut stomata.</p>
<p>Ciri kedua adalah bergerak. Hewan dapat berpindah tempat, misalnya kucing yang berlari mengejar bola. Tumbuhan juga bergerak, tetapi geraknya tidak berpindah tempat. Akar tumbuh menuju air, batang tumbuh menuju cahaya, dan daun putri malu menutup ketika disentuh.</p>
<p>Ciri ketiga adalah membutuhkan makanan dan minuman. Hewan dan manusia mencari makanan, sedangkan tumbuhan membuat makanannya sendiri melalui {{fotosintesis}} dengan bantuan cahaya matahari. Makanan dipakai sebagai sumber tenaga dan bahan untuk tumbuh.</p>
<p>Ciri keempat adalah {{tumbuh}} dan {{berkembang}}. Tumbuh berarti bertambah besar atau bertambah berat, dan bisa diukur, misalnya tinggi badanmu yang bertambah setiap tahun. Berkembang berarti terjadi perubahan bentuk atau kemampuan, misalnya kecebong yang berubah menjadi katak.</p>
<p>Ciri kelima adalah {{berkembang biak}}, yaitu menghasilkan keturunan agar jenisnya tidak punah. Kucing melahirkan anak, ayam bertelur, pohon pisang mengeluarkan tunas, dan jamur melepaskan spora. Ciri keenam adalah peka terhadap {{rangsangan}}. Ketika tanganmu menyentuh panci panas, kamu langsung menariknya. Itu tandanya tubuhmu menerima dan menanggapi rangsangan.</p>
<p>Ciri ketujuh adalah mengeluarkan zat sisa atau {{ekskresi}}. Tubuh manusia mengeluarkan keringat, air seni, dan karbon dioksida. Tumbuhan melepaskan uap air, oksigen, dan getah.</p>
<div class="tw"><table>
<thead><tr><th>Ciri</th><th>Contoh pada hewan</th><th>Contoh pada tumbuhan</th></tr></thead>
<tbody>
<tr><td>Bernapas</td><td>Ikan memakai insang</td><td>Daun memakai stomata</td></tr>
<tr><td>Bergerak</td><td>Burung terbang</td><td>Akar tumbuh ke arah air</td></tr>
<tr><td>Memerlukan makanan</td><td>Sapi makan rumput</td><td>Padi membuat makanan sendiri</td></tr>
<tr><td>Tumbuh dan berkembang</td><td>Anak ayam menjadi ayam dewasa</td><td>Biji menjadi pohon</td></tr>
<tr><td>Berkembang biak</td><td>Katak bertelur</td><td>Singkong ditanam dari batang</td></tr>
<tr><td>Peka rangsang</td><td>Cicak lari saat terkejut</td><td>Putri malu menutup daun</td></tr>
<tr><td>Mengeluarkan zat sisa</td><td>Manusia berkeringat</td><td>Daun menguapkan air</td></tr>
</tbody></table></div>
<aside class="box ingat"><p>Sebuah benda disebut makhluk hidup jika memiliki semua ciri tersebut. Mobil dan awan memang bergerak, tetapi keduanya tidak bernapas, tidak tumbuh, dan tidak berkembang biak.</p></aside>
<aside class="box coba"><p>Letakkan beberapa biji kacang hijau di atas kapas basah dalam dua piring. Taruh satu piring di tempat terang dan satu lagi di dalam kardus gelap. Siram sedikit tiap hari dan ukur tinggi kecambahnya dengan penggaris selama lima hari. Catat hasilnya. Apa yang kamu perhatikan tentang cara tumbuhan merespons cahaya?</p></aside>`,
      r: `Makhluk hidup memiliki tujuh ciri: bernapas, bergerak, memerlukan makanan, tumbuh dan berkembang, berkembang biak, peka terhadap rangsangan, dan mengeluarkan zat sisa. Hewan dan tumbuhan sama-sama memiliki ciri-ciri itu, hanya caranya berbeda. Benda tak hidup tidak memiliki semua ciri tersebut.`
    },
    {
      t: "Penggolongan Makhluk Hidup",
      c: `<p>Di bumi ada jutaan jenis makhluk hidup. Agar mudah dipelajari, para ilmuwan mengelompokkannya berdasarkan persamaan ciri. Ini mirip cara ibumu menata dapur: piring bersama piring, sendok bersama sendok. Makhluk hidup digolongkan menjadi hewan, tumbuhan, jamur, dan mikroorganisme.</p>
<p>{{Hewan}} tidak dapat membuat makanan sendiri sehingga harus makan makhluk hidup lain. Hewan dibagi menjadi hewan bertulang belakang ({{vertebrata}}) dan hewan tak bertulang belakang ({{invertebrata}}). Vertebrata meliputi mamalia (kucing, sapi), unggas atau aves (ayam, elang), reptil (kadal, ular), amfibi (katak), dan ikan. Invertebrata meliputi serangga, cacing, siput, dan ubur-ubur. Berdasarkan makanannya, ada hewan pemakan tumbuhan ({{herbivora}}) seperti kambing, pemakan daging ({{karnivora}}) seperti harimau, dan pemakan keduanya ({{omnivora}}) seperti ayam dan tikus.</p>
<p>{{Tumbuhan}} umumnya berwarna hijau karena mengandung klorofil, zat yang membantu membuat makanan. Tumbuhan dikelompokkan menjadi tumbuhan berbiji seperti padi, mangga, dan melinjo, serta tumbuhan tak berbiji seperti paku dan {{lumut}}. Tumbuhan memberi kita pangan, kayu, obat, dan oksigen.</p>
<p>{{Jamur}} berbeda dari tumbuhan karena tidak punya klorofil. Jamur tidak membuat makanan sendiri, melainkan menyerap zat makanan dari sisa makhluk hidup yang sudah mati, misalnya roti basi atau kayu lapuk. Ada jamur yang bermanfaat, seperti jamur tiram yang dimasak, jamur tempe yang mengubah kedelai menjadi tempe, dan ragi untuk membuat roti mengembang. Ada pula yang merugikan, seperti jamur penyebab panu dan kurap.</p>
<p>{{Mikroorganisme}} adalah makhluk hidup yang sangat kecil dan baru terlihat dengan mikroskop. Contohnya {{bakteri}} dan {{protozoa}}. Bakteri tertentu membantu membuat yoghurt dan membusukkan sampah menjadi tanah subur. Bakteri lain menyebabkan penyakit seperti diare. Karena itu, kita harus rajin mencuci tangan dengan sabun.</p>
<div class="tw"><table>
<thead><tr><th>Kelompok</th><th>Ciri utama</th><th>Contoh</th><th>Manfaat</th></tr></thead>
<tbody>
<tr><td>Hewan</td><td>Mencari makan sendiri, umumnya bergerak</td><td>Sapi, ayam, ikan lele</td><td>Daging, telur, susu, tenaga</td></tr>
<tr><td>Tumbuhan</td><td>Berklorofil, membuat makanan sendiri</td><td>Padi, jagung, anggrek</td><td>Pangan, oksigen, obat</td></tr>
<tr><td>Jamur</td><td>Tanpa klorofil, menyerap makanan</td><td>Jamur tiram, ragi</td><td>Makanan, fermentasi</td></tr>
<tr><td>Mikroorganisme</td><td>Sangat kecil, perlu mikroskop</td><td>Bakteri, protozoa</td><td>Yoghurt, pengurai sampah</td></tr>
</tbody></table></div>
<aside class="box tahu"><p>Satu sendok teh tanah subur bisa mengandung miliaran bakteri. Mereka bekerja diam-diam menguraikan daun yang gugur menjadi zat hara bagi tumbuhan.</p></aside>`,
      r: `Makhluk hidup digolongkan menjadi hewan, tumbuhan, jamur, dan mikroorganisme berdasarkan persamaan cirinya. Hewan terbagi menjadi vertebrata dan invertebrata. Tumbuhan membuat makanan sendiri, sedangkan jamur tidak. Mikroorganisme ada yang bermanfaat dan ada yang menimbulkan penyakit.`
    },
    {
      t: "Komponen Biotik dan Abiotik dalam Lingkungan",
      c: `<p>Lingkungan adalah segala sesuatu yang ada di sekitar makhluk hidup dan memengaruhi hidupnya. Lingkungan rumahmu terdiri atas tanaman di halaman, kucing yang tidur di teras, udara yang kamu hirup, dan sinar matahari yang masuk lewat jendela. Semua unsur itu dibagi menjadi dua kelompok: komponen biotik dan komponen abiotik.</p>
<p>Komponen {{biotik}} adalah semua makhluk hidup di lingkungan itu, yaitu manusia, hewan, tumbuhan, jamur, dan mikroorganisme. Komponen {{abiotik}} adalah benda tak hidup yang ikut menentukan kehidupan, yaitu air, udara, tanah, batu, cahaya matahari, suhu, dan kelembapan. Pada sebuah kolam ikan, ikan, teratai, dan lumut termasuk biotik. Air, lumpur, sinar matahari, dan suhu air termasuk abiotik.</p>
<p>Kedua komponen ini saling berhubungan erat. Makhluk hidup membutuhkan komponen abiotik. Tumbuhan memerlukan cahaya, air, dan tanah untuk tumbuh. Hewan memerlukan udara dan air untuk bernapas dan minum. Ikan tidak bisa hidup tanpa air, dan kaktus akan layu jika terus-menerus terendam.</p>
<p>Hubungan itu juga berlaku sebaliknya. Makhluk hidup dapat mengubah keadaan abiotik di sekitarnya. Cacing tanah membuat lubang-lubang kecil sehingga tanah menjadi gembur. Akar pohon menahan tanah agar tidak longsor ketika hujan deras dan menyimpan air sehingga mata air tetap mengalir. Hutan yang rindang membuat udara terasa lebih sejuk dibandingkan lapangan terbuka.</p>
<p>Kamu juga perlu mengenal beberapa istilah. {{Habitat}} adalah tempat hidup suatu makhluk hidup. Habitat ikan paus adalah laut, sedangkan habitat orangutan adalah hutan hujan. Sekumpulan makhluk hidup sejenis di suatu tempat disebut {{populasi}}, misalnya semua ikan mas di satu kolam. Gabungan banyak populasi yang berbeda jenis di tempat yang sama disebut {{komunitas}}, misalnya ikan, siput, dan tumbuhan air di kolam itu.</p>
<div class="tw"><table>
<thead><tr><th>Komponen biotik</th><th>Komponen abiotik</th></tr></thead>
<tbody>
<tr><td>Padi, belalang, burung pipit, jamur, bakteri</td><td>Air irigasi, tanah sawah, sinar matahari, udara, suhu</td></tr>
<tr><td>Ikan, kodok, eceng gondok</td><td>Air sungai, batu, lumpur, arus</td></tr>
</tbody></table></div>
<aside class="box ingat"><p>Jika salah satu komponen berubah, komponen lain ikut terpengaruh. Kemarau panjang (abiotik) bisa membuat tanaman layu, dan hewan pemakan tanaman ikut kekurangan makanan.</p></aside>
<aside class="box coba"><p>Pergilah ke halaman atau taman sekolah bersama temanmu. Buat dua daftar dalam bukumu: semua yang hidup dan semua yang tidak hidup. Ada berapa komponen biotik dan abiotik yang kamu temukan? Hubungan apa yang kamu lihat di antara keduanya?</p></aside>`,
      r: `Lingkungan terdiri atas komponen biotik (makhluk hidup) dan komponen abiotik (benda tak hidup). Keduanya saling bergantung dan saling memengaruhi. Habitat adalah tempat hidup makhluk hidup, populasi adalah sekelompok makhluk sejenis, dan komunitas adalah gabungan beberapa populasi.`
    },
    {
      t: "Ekosistem di Sekitar Kita",
      c: `<p>{{Ekosistem}} adalah hubungan saling memengaruhi antara komponen biotik dan abiotik di suatu tempat. Kolam di belakang rumah adalah satu ekosistem, sawah adalah ekosistem lain, dan hutan adalah ekosistem yang jauh lebih besar. Ukurannya boleh kecil, boleh sangat luas, selama unsur hidup dan tak hidupnya saling berhubungan.</p>
<p>Ekosistem darat berada di daratan. Contohnya hutan hujan tropis, sabana, padang rumput, kebun, dan sawah. Hutan hujan tropis di Sumatra dan Kalimantan sangat lebat, hujannya banyak sepanjang tahun, dan dihuni orangutan, harimau, serta ribuan jenis tumbuhan. Di Nusa Tenggara Timur ada {{sabana}}, yaitu padang rumput luas dengan pohon-pohon yang jarang. Di sanalah komodo hidup. Sawah dan kebun adalah ekosistem buatan karena dibuat dan dirawat oleh manusia.</p>
<p>Ekosistem air tawar memiliki air dengan kadar garam sangat rendah. Contohnya sungai, danau, rawa, dan kolam. Danau Toba di Sumatra Utara dan Sungai Kapuas di Kalimantan Barat adalah contoh yang terkenal. Penghuninya antara lain ikan mas, ikan lele, teratai, dan eceng gondok. Air sungai yang mengalir deras banyak bersentuhan dengan udara sehingga kaya oksigen, sedangkan air kolam yang tenang cenderung kurang oksigen di bagian dasarnya.</p>
<p>Ekosistem laut mencakup wilayah yang sangat luas karena sebagian besar permukaan bumi tertutup lautan. Air laut asin. Di laut dangkal terdapat {{terumbu karang}} yang menjadi rumah bagi ribuan jenis ikan, seperti yang ada di Raja Ampat, Papua Barat. Di pantai tertentu tumbuh {{hutan mangrove}} dan padang lamun. Akar mangrove menahan ombak dan menjadi tempat berkembang biak ikan serta kepiting. Laut dalam gelap dan dingin, tetapi tetap dihuni hewan yang menyesuaikan diri dengan keadaan itu.</p>
<p>Indonesia adalah negara kepulauan dengan iklim tropis. Keadaan ini membuat Indonesia memiliki keanekaragaman hayati yang sangat tinggi, termasuk di antara yang tertinggi di dunia. Karena itu, tugas kita menjaganya sangat besar.</p>
<div class="tw"><table>
<thead><tr><th>Jenis ekosistem</th><th>Contoh di Indonesia</th><th>Contoh penghuni</th></tr></thead>
<tbody>
<tr><td>Darat</td><td>Hutan hujan Kalimantan, sabana Nusa Tenggara</td><td>Orangutan, komodo, pohon meranti</td></tr>
<tr><td>Air tawar</td><td>Danau Toba, Sungai Kapuas</td><td>Ikan mas, teratai, eceng gondok</td></tr>
<tr><td>Laut</td><td>Terumbu karang Raja Ampat, mangrove</td><td>Ikan badut, penyu, kepiting</td></tr>
</tbody></table></div>
<aside class="box tahu"><p>Raja Ampat di Papua Barat dikenal sebagai salah satu tempat dengan jenis ikan karang terbanyak di dunia. Ratusan jenis karang tumbuh di perairannya.</p></aside>`,
      r: `Ekosistem adalah hubungan saling memengaruhi antara makhluk hidup dan lingkungan tak hidupnya. Ada ekosistem darat, air tawar, dan laut, serta ekosistem alami dan buatan. Indonesia kaya akan ekosistem dan keanekaragaman hayati yang harus dijaga.`
    },
    {
      t: "Rantai Makanan dan Jaring-jaring Makanan",
      c: `<p>Semua makhluk hidup membutuhkan makanan untuk mendapatkan energi. Perpindahan energi dari satu makhluk hidup ke makhluk hidup lain melalui proses makan dan dimakan digambarkan dengan {{rantai makanan}}. Rantai makanan selalu dimulai dari tumbuhan hijau dan ditulis dengan anak panah yang berarti “dimakan oleh”.</p>
<figure class="fig"><div class="chain"><div class="nd">Padi<small>produsen</small></div><span class="ar" aria-hidden="true">&rarr;</span><div class="nd">Tikus<small>konsumen I</small></div><span class="ar" aria-hidden="true">&rarr;</span><div class="nd">Ular<small>konsumen II</small></div><span class="ar" aria-hidden="true">&rarr;</span><div class="nd">Elang<small>konsumen III</small></div><span class="ar" aria-hidden="true">&rarr;</span><div class="nd">Bakteri<small>pengurai</small></div></div><div class="cap">Contoh rantai makanan di sawah. Anak panah menunjukkan arah perpindahan energi.</div></figure>
<p>Setiap anggota rantai makanan punya peran. {{Produsen}} adalah makhluk hidup yang membuat makanannya sendiri, yaitu tumbuhan hijau melalui fotosintesis. {{Konsumen}} adalah makhluk hidup yang tidak bisa membuat makanan sendiri. Konsumen tingkat satu memakan produsen, misalnya tikus yang memakan padi. Konsumen tingkat dua memakan konsumen tingkat satu, misalnya ular yang memakan tikus. Konsumen puncak biasanya tidak punya pemangsa alami, seperti elang. {{Pengurai}} seperti bakteri dan jamur menguraikan tubuh makhluk yang mati menjadi zat hara yang kembali ke tanah dan dimanfaatkan lagi oleh tumbuhan.</p>
<p>Di alam, satu hewan biasanya memakan lebih dari satu jenis makanan. Tikus memakan padi, jagung, dan serangga. Elang memakan ular, tikus, dan burung kecil. Karena itu banyak rantai makanan saling berhubungan dan membentuk {{jaring-jaring makanan}}. Jaring-jaring ini lebih mantap daripada satu rantai. Jika satu jenis makanan berkurang, hewan pemakannya masih bisa memilih makanan lain.</p>
<p>Gambaran lain adalah {{piramida makanan}}. Jumlah produsen paling banyak sehingga berada di dasar, lalu jumlah konsumen tingkat berikutnya makin sedikit. Hal itu terjadi karena hanya sebagian kecil energi, sekitar sepersepuluh, yang diteruskan ke tingkat berikutnya. Sisanya dipakai untuk hidup atau terbuang sebagai panas. Itulah sebabnya jumlah elang di sawah jauh lebih sedikit daripada jumlah padi.</p>
<figure class="fig"><div class="pyr" role="img" aria-label="Piramida makanan dari dasar ke puncak: padi, belalang dan tikus, ular, elang"><div style="width:30%">Elang</div><div style="width:50%">Ular</div><div style="width:70%">Tikus, belalang</div><div style="width:92%">Padi dan rumput</div></div><div class="cap">Semakin ke atas, jumlah makhluk hidup dan energi yang tersedia semakin sedikit.</div></figure>
<aside class="box coba"><p>Buatlah rantai makanan dari makanan yang kamu santap hari ini. Misalnya nasi goreng dengan telur. Telusuri asal-usulnya: ayam makan jagung, jagung adalah tumbuhan. Siapa produsennya, dan siapa konsumennya?</p></aside>`,
      r: `Rantai makanan menunjukkan perpindahan energi dari produsen ke konsumen dan akhirnya ke pengurai. Banyak rantai makanan yang saling terhubung membentuk jaring-jaring makanan. Dalam piramida makanan, jumlah makhluk hidup semakin sedikit pada tingkat yang lebih tinggi.`
    },
    {
      t: "Adaptasi Makhluk Hidup",
      c: `<p>Setiap tempat memiliki keadaan yang berbeda. Gurun sangat panas dan kering, kutub sangat dingin, dan laut dalam sangat gelap. Makhluk hidup tidak dapat memilih tempat dengan bebas, jadi mereka harus menyesuaikan diri dengan lingkungannya agar bisa bertahan hidup. Kemampuan menyesuaikan diri ini disebut {{adaptasi}}. Adaptasi terbentuk dalam waktu yang sangat panjang dan diwariskan kepada keturunannya.</p>
<p>Adaptasi struktur tubuh adalah penyesuaian bentuk tubuh. Kaki bebek berselaput sehingga pandai berenang. Paruh burung pipit pendek dan kuat untuk memecah biji, sedangkan paruh burung kolibri panjang untuk mengisap madu. Leher jerapah panjang agar bisa meraih daun di pohon tinggi. Pada tumbuhan, daun kaktus berubah menjadi duri untuk mengurangi penguapan air. Daun teratai lebar dan tipis agar mengapung dan menangkap cahaya. Bunglon dan belalang ranting punya warna dan bentuk menyerupai lingkungan sehingga sulit dilihat pemangsa. Cara ini disebut kamuflase.</p>
<p>Adaptasi fisiologi adalah penyesuaian cara kerja tubuh. Ikan laut hidup di air asin dan mampu membuang kelebihan garam dari tubuhnya melalui insang. Unta mampu menyimpan cadangan lemak di punuknya dan mengeluarkan air seni yang sangat pekat sehingga tahan kekurangan air. Manusia berkeringat ketika udara panas agar suhu tubuh turun. Pada tumbuhan, akar mangrove menyerap air dan mengeluarkan kelebihan garam dari daunnya.</p>
<p>Adaptasi tingkah laku adalah penyesuaian cara berperilaku. Kelelawar tidur siang hari dan mencari makan di malam hari ketika serangga banyak dan pemangsa berkurang. Burung-burung tertentu bermigrasi, yaitu terbang jauh ke tempat yang lebih hangat ketika musim berganti. Gurita menyemprotkan tinta untuk mengelabui musuhnya. Putri malu melipat daunnya ketika disentuh untuk melindungi diri.</p>
<div class="tw"><table>
<thead><tr><th>Jenis adaptasi</th><th>Contoh pada hewan</th><th>Contoh pada tumbuhan</th></tr></thead>
<tbody>
<tr><td>Struktur tubuh</td><td>Kaki bebek berselaput, leher jerapah panjang</td><td>Duri kaktus, akar napas mangrove</td></tr>
<tr><td>Fisiologi</td><td>Ikan laut membuang kelebihan garam</td><td>Mangrove mengeluarkan garam lewat daun</td></tr>
<tr><td>Tingkah laku</td><td>Kelelawar aktif malam hari, burung bermigrasi</td><td>Putri malu menutup daun</td></tr>
</tbody></table></div>
<aside class="box tahu"><p>Akar napas mangrove tumbuh menjulang dari lumpur seperti pasak. Tanah pantai berlumpur kekurangan oksigen sehingga akar itu mengambil udara langsung dari atas permukaan.</p></aside>
<aside class="box ingat"><p>Adaptasi tidak terjadi dalam semalam. Sebuah makhluk hidup tidak bisa langsung memilih berubah, tetapi ciri yang cocok dengan lingkungan membantunya bertahan dan diturunkan kepada anak-anaknya.</p></aside>`,
      r: `Adaptasi adalah kemampuan makhluk hidup menyesuaikan diri dengan lingkungannya agar dapat bertahan hidup. Adaptasi ada tiga jenis: struktur tubuh, fisiologi, dan tingkah laku. Contohnya kaki bebek berselaput, ikan laut yang membuang garam, dan kelelawar yang aktif pada malam hari.`
    },
    {
      t: "Interaksi Antarmakhluk Hidup",
      c: `<p>Tidak ada makhluk hidup yang benar-benar hidup sendirian. Setiap hari mereka berhubungan dengan makhluk hidup lain, ada yang saling menolong, ada yang merugikan, dan ada pula yang tidak saling memengaruhi. Hubungan ini disebut interaksi.</p>
<p>Hubungan dua makhluk hidup berbeda jenis yang hidup berdekatan disebut {{simbiosis}}. Pertama, {{mutualisme}}, yaitu hubungan yang saling menguntungkan. Lebah mendapat madu dari bunga, sementara bunga terbantu penyerbukannya oleh lebah. Burung jalak memakan kutu di tubuh kerbau, sehingga jalak kenyang dan kerbau terbebas dari kutu. Bakteri pada bintil akar tanaman kacang-kacangan membantu tanaman itu mendapat zat hara, dan bakteri mendapat tempat tinggal.</p>
<p>Kedua, {{komensalisme}}, yaitu hubungan yang menguntungkan satu pihak sedangkan pihak lain tidak dirugikan dan tidak diuntungkan. Anggrek menempel pada batang pohon agar mendapat cahaya matahari yang lebih banyak, sementara pohon tidak terganggu. Ikan remora menempel pada tubuh hiu agar ikut berpindah tempat dan mendapat sisa makanan.</p>
<p>Ketiga, {{parasitisme}}, yaitu hubungan yang menguntungkan satu pihak dan merugikan pihak lain. Pihak yang untung disebut parasit dan yang rugi disebut inang. Kutu merugikan kucing dengan mengisap darahnya. Benalu menempel di pohon jeruk dan mencuri air serta zat makanan sehingga pohon menjadi kurus. Cacing pita hidup dalam usus dan mengambil makanan dari tubuh inangnya.</p>
<p>Ada pula hubungan antarmakhluk hidup yang tidak hidup bersama secara dekat. {{Predasi}} adalah hubungan antara pemangsa dan mangsanya, misalnya elang menangkap ayam atau kucing menangkap tikus. Pemangsa membantu menjaga jumlah mangsa tetap seimbang. {{Kompetisi}} adalah persaingan memperebutkan sesuatu yang jumlahnya terbatas, seperti makanan, air, tempat tinggal, atau cahaya. Rumput dan tanaman kecil bersaing dengan pohon besar untuk mendapatkan cahaya, dan dua kucing jantan bisa berebut daerah kekuasaan.</p>
<div class="tw"><table>
<thead><tr><th>Interaksi</th><th>Pihak A</th><th>Pihak B</th><th>Contoh</th></tr></thead>
<tbody>
<tr><td>Mutualisme</td><td>Untung</td><td>Untung</td><td>Lebah dan bunga</td></tr>
<tr><td>Komensalisme</td><td>Untung</td><td>Tidak terpengaruh</td><td>Anggrek dan pohon</td></tr>
<tr><td>Parasitisme</td><td>Untung</td><td>Rugi</td><td>Benalu dan pohon jeruk</td></tr>
<tr><td>Predasi</td><td>Memangsa</td><td>Dimangsa</td><td>Elang dan ayam</td></tr>
<tr><td>Kompetisi</td><td>Berebut</td><td>Berebut</td><td>Tanaman berebut cahaya</td></tr>
</tbody></table></div>
<aside class="box ingat"><p>Cara mudah menghafalnya: mutualisme berarti sama-sama untung, komensalisme berarti satu untung dan satu biasa saja, parasitisme berarti satu untung dan satu rugi.</p></aside>`,
      r: `Makhluk hidup berinteraksi satu sama lain. Simbiosis terdiri atas mutualisme (saling menguntungkan), komensalisme (satu untung, satu tidak terpengaruh), dan parasitisme (satu untung, satu rugi). Selain itu ada predasi dan kompetisi yang menjaga keseimbangan alam.`
    },
    {
      t: "Menjaga Keseimbangan dan Kelestarian Lingkungan",
      c: `<p>Alam yang sehat memiliki keseimbangan. Jumlah pemangsa dan mangsa, jumlah produsen dan konsumen, semuanya berada dalam takaran yang cocok. Contohnya di sawah. Bila elang dan ular terlalu banyak ditangkap orang, jumlah tikus akan melonjak dan padi habis dimakan. Karena itu sebagian petani memelihara burung hantu agar tikus terkendali secara alami. Ini contoh bahwa satu perubahan kecil bisa mengguncang seluruh ekosistem.</p>
<p>Sayangnya, kegiatan manusia sering merusak keseimbangan itu. Pertama adalah {{pencemaran}}. Pencemaran air terjadi ketika limbah pabrik, deterjen, dan sampah plastik dibuang ke sungai sehingga ikan mati. Pencemaran udara berasal dari asap kendaraan, pabrik, dan kebakaran hutan. Pencemaran tanah berasal dari tumpukan sampah plastik yang sulit terurai dan pestisida yang berlebihan.</p>
<p>Kedua adalah kerusakan habitat. Penebangan hutan secara liar, pembakaran lahan, dan pembukaan lahan menghilangkan rumah bagi banyak hewan. Akibatnya jumlah hewan menurun dan sebagian terancam punah. Hutan yang gundul juga menyebabkan banjir dan tanah longsor karena tidak ada lagi akar yang menahan tanah dan menyerap air hujan.</p>
<p>Indonesia memiliki banyak flora dan fauna langka, misalnya harimau sumatra, orangutan, badak jawa, komodo, jalak bali, elang jawa, dan cenderawasih. Contoh tumbuhan langka adalah bunga bangkai dan rafflesia. Makhluk hidup {{langka}} berarti jumlahnya sangat sedikit di alam. Bila tidak dilindungi, mereka bisa {{punah}} dan tidak akan pernah kembali.</p>
<p>Berbagai upaya {{pelestarian}} sudah dilakukan. Pemerintah membuat cagar alam dan taman nasional, misalnya Taman Nasional Ujung Kulon untuk badak jawa, Taman Nasional Komodo untuk komodo, serta Taman Nasional Gunung Leuser untuk orangutan. Ada pula {{penangkaran}}, yaitu mengembangbiakkan hewan langka di tempat yang aman. Penebangan hutan diperbaiki dengan {{reboisasi}}, yaitu menanam kembali pohon di hutan yang gundul.</p>
<p>Kita sebagai anak-anak pun bisa berperan. Buanglah sampah pada tempatnya dan pilah sampah. Terapkan prinsip 3R: {{reduce}} (mengurangi sampah), {{reuse}} (memakai ulang), dan {{recycle}} (mendaur ulang). Tanamlah pohon, hematlah air, dan jangan membeli atau memelihara satwa langka yang diambil dari alam.</p>
<aside class="box ingat"><p>Satwa langka dilindungi undang-undang. Memburu, memperjualbelikan, atau memeliharanya tanpa izin adalah perbuatan yang melanggar hukum.</p></aside>
<aside class="box coba"><p>Kumpulkan sampah plastik bersih di rumah selama satu minggu, misalnya botol dan wadah bekas. Pikirkan cara memakainya ulang: botol bisa jadi pot tanaman, wadah bisa jadi tempat pensil. Tulis berapa banyak sampah yang berhasil kamu kurangi.</p></aside>`,
      r: `Alam yang seimbang dapat rusak oleh pencemaran dan kerusakan habitat. Banyak flora dan fauna Indonesia yang langka sehingga perlu dilindungi melalui taman nasional, penangkaran, dan reboisasi. Setiap orang, termasuk anak-anak, dapat membantu dengan menerapkan 3R dan menanam pohon.`
    }

var BAB2 = {
  no: 2,
  judul: "Zat dan Perubahannya",
  desk: "Memahami wujud, sifat, dan perubahan zat, juga cara memisahkan campuran dan memakai zat dengan aman.",
  subs: [
    {
      t: "Apa Itu Zat? Materi, Massa, dan Volume",
      c: `<p>Bayangkan semua yang ada di sekitarmu: air minum, buku, meja, udara, bahkan tubuhmu sendiri. Semua itu terbuat dari {{zat}}, yang juga disebut {{materi}}. Dalam IPAS, zat didefinisikan sebagai segala sesuatu yang menempati ruang dan memiliki massa. Dua syarat ini sangat penting. Jika sesuatu tidak menempati ruang dan tidak punya massa, ia bukan zat.</p>
<p>Mengapa udara disebut zat padahal tidak terlihat? Karena udara menempati ruang dan punya massa. Kamu bisa membuktikannya. Saat meniup balon, balon itu mengembang karena udara memenuhi ruang di dalamnya. Balon yang berisi udara juga lebih berat dibandingkan balon kosong, walaupun bedanya sedikit sekali. Sebaliknya, cahaya, bunyi, dan panas bukan zat. Ketiganya adalah bentuk energi yang tidak punya massa dan tidak menempati ruang.</p>
<p>{{Massa}} adalah banyaknya zat yang terkandung dalam suatu benda. Massa diukur dengan {{neraca}}, misalnya timbangan dapur atau timbangan pasar. Satuan massa adalah kilogram (kg) dan gram (g). Satu kilogram sama dengan 1.000 gram. Dalam kehidupan sehari-hari, orang sering menyebut “berat badan” padahal yang ditimbang adalah massa tubuh. Di sini kita memakai istilah massa agar tepat.</p>
<p>{{Volume}} adalah ruang yang ditempati suatu benda. Untuk zat cair, volume diukur memakai {{gelas ukur}} dengan satuan liter (L) atau mililiter (mL). Satu liter sama dengan 1.000 mL, atau sama dengan 1.000 sentimeter kubik (cm³). Untuk benda padat yang bentuknya teratur seperti balok, volume dihitung dengan rumus panjang × lebar × tinggi. Untuk benda yang bentuknya tidak beraturan seperti batu, kita memasukkannya ke dalam gelas ukur berisi air. Kenaikan permukaan air menunjukkan volume batu tersebut.</p>
<div class="tw"><table>
<thead><tr><th>Besaran</th><th>Artinya</th><th>Alat ukur</th><th>Satuan</th></tr></thead>
<tbody>
<tr><td>Massa</td><td>Banyaknya zat dalam benda</td><td>Neraca</td><td>g, kg</td></tr>
<tr><td>Volume</td><td>Ruang yang ditempati benda</td><td>Gelas ukur, penggaris</td><td>mL, L, cm³</td></tr>
</tbody></table></div>
<aside class="box ingat"><p>Zat = menempati ruang + memiliki massa. Besar kecilnya massa tidak selalu sama dengan besar kecilnya volume. Segenggam besi lebih besar massanya daripada segenggam kapas, padahal volumenya hampir sama.</p></aside>
<aside class="box coba"><p>Ambil satu gelas bening berisi air sampai setengahnya dan tandai tinggi airnya. Masukkan sebuah batu kecil yang bersih. Perhatikan tinggi air sesudah batu masuk. Mengapa air naik? Bagaimana ini menunjukkan bahwa batu menempati ruang?</p></aside>`,
      r: `Zat atau materi adalah segala sesuatu yang menempati ruang dan memiliki massa. Massa diukur dengan neraca dalam satuan gram atau kilogram, sedangkan volume diukur dalam mililiter, liter, atau sentimeter kubik. Cahaya, bunyi, dan panas bukan zat.`
    },
    {
      t: "Wujud Zat: Padat, Cair, dan Gas",
      c: `<p>Zat yang kita jumpai setiap hari berada dalam tiga wujud: {{padat}}, {{cair}}, dan {{gas}}. Wujud itu bisa kita kenali dari bentuk dan volumenya. Contoh yang paling mudah adalah air. Air bisa berwujud padat sebagai es batu, cair sebagai air minum, dan gas sebagai uap air. Zatnya sama, hanya wujudnya yang berbeda.</p>
<p>Zat padat memiliki bentuk dan volume yang tetap. Sebuah pensil tetap berbentuk pensil walaupun dipindah dari tas ke meja. Zat padat tidak mudah ditekan. Zat cair memiliki volume tetap, tetapi bentuknya berubah mengikuti wadahnya. Satu gelas sirup akan berbentuk gelas jika ada di gelas, dan berbentuk botol jika dituang ke botol, tetapi banyaknya tetap satu gelas. Zat gas tidak memiliki bentuk dan volume yang tetap. Gas mengisi seluruh ruang yang ada. Udara dalam ban sepeda mengikuti bentuk ban, dan gas dapat ditekan sehingga muat lebih banyak di tempat sempit.</p>
<p>Mengapa wujud zat berbeda-beda? Jawabannya ada pada {{partikel}}, yaitu bagian-bagian yang sangat kecil penyusun zat dan tidak dapat dilihat mata. Pada zat padat, partikel tersusun rapat dan teratur, dan hanya bergetar di tempatnya. Pada zat cair, partikel berdekatan tetapi susunannya tidak teratur sehingga mereka dapat bergeser dan saling meluncur. Pada gas, partikel sangat berjauhan dan bergerak bebas ke segala arah dengan cepat.</p>

<aside class="box tahu"><p>Karena sangat renggang, gas bisa dimampatkan. Itulah sebabnya gas elpiji di tabung kompor dibuat cair dengan tekanan tinggi supaya muat banyak dalam tabung kecil.</p></aside>`,
      r: `Zat memiliki tiga wujud: padat, cair, dan gas. Zat padat memiliki bentuk dan volume tetap, zat cair memiliki volume tetap tetapi bentuknya mengikuti wadah, dan gas mengikuti bentuk dan volume ruang. Perbedaan itu disebabkan oleh susunan dan gerak partikelnya.`
    },
    {
      t: "Sifat-sifat Zat",
      c: `<p>Setiap zat punya ciri khas yang disebut sifat. Dengan memahami sifat, kita bisa membedakan satu zat dari zat lainnya dan memilih bahan yang cocok untuk membuat sesuatu. Sifat yang dapat diamati tanpa mengubah zat menjadi zat lain disebut sifat fisika.</p>
<p>Beberapa sifat fisika yang mudah diamati dengan pancaindra adalah warna, bau, rasa, dan wujud. Garam putih dan asin, cuka bening dan berbau menyengat, belerang kuning dan berbau tajam. Ada pula sifat kekerasan. Intan sangat keras sehingga dipakai pada alat pemotong kaca, sedangkan kapur tulis mudah patah. Kelenturan juga merupakan sifat, misalnya karet gelang yang lentur dan kaca yang getas.</p>
<p>{{Daya larut}} adalah kemampuan suatu zat larut dalam zat lain. Gula dan garam mudah larut dalam air, sedangkan pasir dan minyak tidak. {{Daya hantar}} adalah kemampuan zat menghantarkan panas atau listrik. Logam seperti tembaga menghantarkan listrik dan panas dengan baik, makanya kabel dibuat dari tembaga. Plastik dan karet menghantarkannya dengan buruk, sehingga dipakai untuk membungkus kabel dan gagang panci.</p>
<p>Sifat lain adalah titik leleh dan {{titik didih}}. Air membeku pada suhu 0 °C dan mendidih pada 100 °C di permukaan laut. Zat lain punya angka berbeda. Minyak goreng baru mendidih di suhu yang jauh lebih tinggi.</p>
<p>Satu sifat yang penting adalah {{massa jenis}}, yaitu perbandingan massa dengan volume, atau seberapa padat zat itu. Besi massa jenisnya besar, sedangkan kayu massa jenisnya kecil. Benda dengan massa jenis lebih kecil daripada air akan mengapung, dan yang lebih besar akan tenggelam. Itulah sebabnya kayu mengapung dan batu tenggelam. Minyak berada di atas air karena massa jenisnya lebih kecil. Kapal besi yang besar bisa mengapung karena bagian dalamnya berongga berisi udara sehingga massa jenis kapal secara keseluruhan lebih kecil daripada air.</p>
<div class="tw"><table>
<thead><tr><th>Sifat</th><th>Artinya</th><th>Contoh</th></tr></thead>
<tbody>
<tr><td>Warna, bau, rasa</td><td>Dikenali dengan pancaindra</td><td>Garam putih dan asin</td></tr>
<tr><td>Kekerasan</td><td>Ketahanan terhadap goresan</td><td>Intan keras, kapur lunak</td></tr>
<tr><td>Daya larut</td><td>Mudah atau tidaknya larut</td><td>Gula larut, pasir tidak larut</td></tr>
<tr><td>Daya hantar</td><td>Menghantarkan panas atau listrik</td><td>Tembaga menghantarkan, karet tidak</td></tr>
<tr><td>Massa jenis</td><td>Massa dibagi volume</td><td>Kayu mengapung, batu tenggelam</td></tr>
</tbody></table></div>
<aside class="box ingat"><p>Mengapung atau tenggelamnya benda ditentukan oleh massa jenisnya dibandingkan dengan air, bukan oleh besar kecilnya benda. Kapal besar bisa mengapung, sedangkan paku kecil tenggelam.</p></aside>
<aside class="box coba"><p>Siapkan semangkuk air dan beberapa benda: paku, kayu kecil, gabus, uang logam, daun kering, dan klip kertas. Tebak dulu apakah masing-masing mengapung atau tenggelam. Masukkan satu per satu lalu cocokkan dengan tebakanmu. Pisahkan hasilnya dalam dua kelompok.</p></aside>`,
      r: `Sifat fisika zat dapat diamati tanpa mengubah zat itu, misalnya warna, bau, rasa, kekerasan, daya larut, daya hantar, dan titik didih. Massa jenis menunjukkan seberapa padat suatu zat dan menentukan apakah benda mengapung atau tenggelam di air.`
    },
    {
      t: "Perubahan Wujud Zat dan Daur Air",
      c: `<p>Zat dapat berganti wujud ketika dipanaskan atau didinginkan. Es batu yang dibiarkan di meja akan menjadi air, dan air yang direbus lama-kelamaan menjadi uap. Dalam semua perubahan ini zatnya tetap sama, hanya wujudnya yang berubah. Panas yang dipindahkan itu disebut {{kalor}}.</p>
<p>Ada enam perubahan wujud. {{Mencair}} adalah perubahan dari padat menjadi cair, contohnya es yang meleleh. {{Membeku}} adalah cair menjadi padat, contohnya air di freezer menjadi es. {{Menguap}} adalah cair menjadi gas, contohnya jemuran yang mengering. {{Mengembun}} adalah gas menjadi cair, contohnya tetes air di luar gelas es teh. {{Menyublim}} adalah padat langsung menjadi gas tanpa melewati wujud cair, contohnya kapur barus yang makin mengecil di lemari pakaian. {{Mengkristal}} adalah gas langsung menjadi padat, contohnya terbentuknya bunga es di dinding freezer.</p>
<figure class="fig"><div class="chain"><div class="nd">Padat<small>es batu</small></div><div style="text-align:center;font-size:.85rem;line-height:1.5"><span class="ar" aria-hidden="true">&rarr;</span> mencair<br><span class="ar" aria-hidden="true">&larr;</span> membeku</div><div class="nd">Cair<small>air</small></div><div style="text-align:center;font-size:.85rem;line-height:1.5"><span class="ar" aria-hidden="true">&rarr;</span> menguap<br><span class="ar" aria-hidden="true">&larr;</span> mengembun</div><div class="nd">Gas<small>uap air</small></div></div><div class="cap">Padat langsung ke gas: menyublim. Gas langsung ke padat: mengkristal.</div></figure>
<p>Kapan zat menyerap kalor dan kapan melepasnya? Mencair, menguap, dan menyublim membutuhkan kalor, jadi zat menyerap panas dari sekitarnya. Membeku, mengembun, dan mengkristal melepaskan kalor ke sekitarnya. Itulah sebabnya kamu merasa dingin ketika bajumu basah. Air di bajumu menyerap panas dari tubuh saat menguap.</p>
<p>Perubahan wujud air membentuk {{daur air}}. Panas matahari menguapkan air laut, sungai, dan danau. Tumbuhan juga melepaskan uap air dari daunnya. Uap naik ke udara yang dingin lalu mengembun menjadi titik-titik air kecil yang membentuk awan. Ketika titik-titik itu semakin banyak dan berat, mereka jatuh sebagai hujan, yang disebut {{presipitasi}}. Air hujan mengalir ke sungai dan meresap ke dalam tanah, lalu kembali ke laut. Siklus ini berputar terus-menerus sehingga persediaan air bumi tidak habis, hanya berpindah tempat dan berganti wujud.</p>
<figure class="fig"><div class="chain"><div class="nd">Penguapan<small>air laut dan sungai</small></div><span class="ar" aria-hidden="true">&rarr;</span><div class="nd">Pengembunan<small>awan</small></div><span class="ar" aria-hidden="true">&rarr;</span><div class="nd">Hujan<small>presipitasi</small></div><span class="ar" aria-hidden="true">&rarr;</span><div class="nd">Mengalir<small>sungai, laut, tanah</small></div></div><div class="cap">Daur air berulang tanpa henti, digerakkan oleh panas matahari.</div></figure>
<aside class="box coba"><p>Letakkan beberapa es batu di dalam gelas bening dan biarkan di meja. Perhatikan permukaan luar gelas setelah beberapa menit. Dari mana asalnya tetes air itu? Ingat, air itu bukan merembes dari dalam gelas. Ia berasal dari uap air di udara yang mengembun.</p></aside>`,
      r: `Zat dapat berubah wujud: mencair, membeku, menguap, mengembun, menyublim, dan mengkristal. Mencair, menguap, dan menyublim menyerap kalor, sedangkan membeku, mengembun, dan mengkristal melepas kalor. Perubahan wujud air di alam membentuk daur air.`
    },
    {
      t: "Perubahan Fisika dan Perubahan Kimia",
      c: `<p>Zat tidak hanya berubah wujud. Zat dapat pula berubah menjadi zat lain. Para ilmuwan membagi perubahan zat menjadi dua jenis: perubahan fisika dan perubahan kimia.</p>
<p>{{Perubahan fisika}} adalah perubahan yang tidak menghasilkan zat baru. Yang berubah hanya bentuk, ukuran, atau wujudnya, sedangkan zat penyusunnya tetap sama. Contohnya es mencair menjadi air, gula larut dalam teh, kertas disobek, kawat dilengkungkan, dan kapur barus yang menyublim. Semua zatnya tetap itu-itu saja.</p>
<p>{{Perubahan kimia}} adalah perubahan yang menghasilkan zat baru yang sifatnya berbeda dari zat semula. Contohnya kertas yang dibakar menjadi abu dan asap. Abu jelas bukan kertas lagi. Besi yang dibiarkan basah di udara akan {{berkarat}}, dan karat itu berbeda dari besinya. Nasi dan sayur yang dibiarkan lama menjadi basi. Telur yang digoreng tidak bisa kembali menjadi telur mentah. Singkong yang diragikan menjadi tape juga contoh perubahan kimia. Proses itu disebut {{fermentasi}}.</p>
<p>Bagaimana cara mengenali perubahan kimia? Ada beberapa tanda. Pertama, terjadi perubahan warna, seperti kertas menghitam saat terbakar. Kedua, muncul gelembung gas, seperti ketika tablet vitamin dimasukkan ke dalam air. Ketiga, muncul bau baru, seperti bau makanan basi. Keempat, terjadi perubahan suhu, seperti panas pada api unggun. Kelima, terbentuk endapan, yaitu padatan yang muncul di dalam cairan. Biasanya perubahan kimia juga sulit atau tidak bisa dikembalikan seperti semula.</p>
<div class="tw"><table>
<thead><tr><th>Perubahan fisika</th><th>Perubahan kimia</th></tr></thead>
<tbody>
<tr><td>Tidak terbentuk zat baru</td><td>Terbentuk zat baru</td></tr>
<tr><td>Es mencair, gula larut dalam air</td><td>Kertas terbakar, besi berkarat</td></tr>
<tr><td>Membelah kayu, menggunting kain</td><td>Makanan basi, kayu membusuk</td></tr>
<tr><td>Sering mudah dikembalikan</td><td>Sulit dikembalikan</td></tr>
</tbody></table></div>
<aside class="box ingat"><p>Kuncinya ada pada zat baru. Jika zat penyusunnya tetap sama, itu perubahan fisika. Jika terbentuk zat baru dengan sifat berbeda, itu perubahan kimia.</p></aside>
<aside class="box coba"><p>Lakukan bersama orang dewasa. Masukkan satu sendok teh soda kue (baking soda) ke dalam gelas, lalu tuangkan sedikit cuka. Gelembung gas akan muncul. Gelembung itu adalah zat baru. Apakah ini perubahan fisika atau kimia? Bandingkan dengan melarutkan gula dalam air, yang tidak menghasilkan gelembung dan zat baru.</p></aside>`,
      r: `Perubahan fisika tidak menghasilkan zat baru, sedangkan perubahan kimia menghasilkan zat baru. Tanda perubahan kimia antara lain perubahan warna, timbul gas, bau baru, perubahan suhu, dan endapan. Contoh perubahan kimia adalah kertas terbakar, besi berkarat, dan makanan basi.`
    },
    {
      t: "Campuran dan Larutan",
      c: `<p>Dalam kehidupan sehari-hari, kita jarang menemukan zat yang benar-benar murni. Air teh manis, sayur sop, dan udara semuanya berupa {{campuran}}. Campuran terbentuk ketika dua zat atau lebih bergabung tanpa mengubah sifat masing-masing zat. Gula dalam teh masih bersifat manis, dan airnya tetap air. Campuran dapat dipisahkan kembali menjadi zat-zat penyusunnya.</p>
<p>Berdasarkan keseragamannya, campuran ada dua macam. {{Campuran homogen}} adalah campuran yang bagian-bagiannya tampak seragam dan tidak bisa dibedakan satu sama lain. Contohnya air gula, teh manis, air garam, udara bersih, dan sirup. Campuran homogen yang berupa cairan disebut {{larutan}}. {{Campuran heterogen}} adalah campuran yang masing-masing zatnya masih tampak berbeda. Contohnya pasir dalam air, minyak dalam air, salad buah, nasi goreng, dan kerikil dengan pasir.</p>
<p>Pada larutan, zat yang melarutkan disebut {{pelarut}} dan zat yang larut disebut {{zat terlarut}}. Pada air gula, airnya adalah pelarut dan gulanya zat terlarut. Pelarut yang paling umum adalah air, sehingga air sering disebut pelarut universal walaupun ada zat yang tidak larut dalam air, seperti minyak dan lilin.</p>
<p>Apa saja yang membuat zat lebih cepat larut? Ada tiga cara. Pertama, mengaduk, karena aduk membuat partikel gula terus bersentuhan dengan air yang belum jenuh. Kedua, menggunakan air hangat, karena suhu lebih tinggi membuat partikel bergerak lebih aktif. Ketiga, menghaluskan zat, karena butiran yang lebih kecil memiliki permukaan lebih banyak yang bersentuhan dengan pelarut. Itu sebabnya gula pasir lebih cepat larut daripada gula batu. Meski begitu, jumlah zat yang bisa larut punya batas. Kalau pelarut sudah tidak sanggup melarutkan lagi, larutannya disebut jenuh dan sisa zat akan mengendap di dasar.</p>
<p>Ada pula campuran yang tampak keruh dan akan mengendap jika didiamkan, yang disebut {{suspensi}}. Air sungai yang keruh oleh lumpur dan obat sirup yang harus dikocok dulu sebelum diminum adalah contohnya.</p>
<div class="tw"><table>
<thead><tr><th>Jenis campuran</th><th>Ciri</th><th>Contoh</th></tr></thead>
<tbody>
<tr><td>Homogen (larutan)</td><td>Seragam, zat tidak terlihat terpisah</td><td>Air gula, air garam, teh manis</td></tr>
<tr><td>Heterogen</td><td>Zat penyusun terlihat berbeda</td><td>Pasir dan air, nasi goreng</td></tr>
<tr><td>Suspensi</td><td>Keruh, mengendap jika didiamkan</td><td>Air sungai keruh, sirup obat</td></tr>
</tbody></table></div>
<aside class="box coba"><p>Siapkan tiga gelas air. Masukkan satu sendok teh gula, garam, dan pasir ke gelas yang berbeda, lalu aduk. Mana yang tampak menyatu dengan air dan mana yang tidak? Klasifikasikan hasilnya sebagai campuran homogen atau heterogen.</p></aside>`,
      r: `Campuran adalah gabungan dua zat atau lebih yang tidak kehilangan sifatnya. Campuran homogen tampak seragam, sedangkan campuran heterogen masih terlihat terpisah. Larutan terdiri atas pelarut dan zat terlarut, dan zat lebih cepat larut jika diaduk, dipanaskan, atau dihaluskan.`
    },
    {
      t: "Cara Memisahkan Campuran",
      c: `<p>Karena zat-zat dalam campuran masih menyimpan sifat aslinya, kita bisa memisahkannya kembali. Caranya dipilih berdasarkan perbedaan sifat zat-zat tersebut, seperti ukuran butir, wujud, titik didih, atau sifat magnet.</p>
<p>{{Penyaringan}} memisahkan padatan yang tidak larut dari cairan dengan memakai saringan atau kertas saring. Ibu menyaring santan untuk membuang ampas kelapa, dan penyaring kopi menahan ampas sementara air kopi lewat. Prinsipnya, lubang saringan lebih kecil daripada butiran padatan.</p>
<p>{{Penguapan}} atau pengeringan dipakai untuk memisahkan zat padat yang larut dari cairannya. Air laut dijemur di tambak sehingga airnya menguap dan tersisa garam. Cara ini dipakai oleh petani garam, misalnya di Madura. {{Penyulingan}} atau destilasi memisahkan cairan dari cairan lain atau dari padatan, berdasarkan perbedaan titik didih. Cairan dipanaskan sampai menguap, lalu uapnya didinginkan agar mengembun dan ditampung. Cara ini dipakai untuk membuat air suling dan mengambil minyak atsiri, misalnya minyak kayu putih dan minyak serai wangi, dari daunnya.</p>
<p>{{Dekantasi}} adalah menuangkan cairan perlahan dari wadah setelah padatan mengendap di dasar. Misalnya saat membuang air bening di atas endapan tepung dalam pembuatan tepung kanji. {{Pengayakan}} memisahkan butiran padat berdasarkan ukuran memakai ayakan, seperti memisahkan kerikil dari pasir atau menyaring tepung agar halus. {{Magnet}} dipakai untuk memisahkan benda yang tertarik magnet, misalnya paku besi dari pasir.</p>
<p>{{Kromatografi}} memisahkan zat berwarna atau zat lain berdasarkan kecepatan mereka merambat pada kertas atau bahan penyerap. Warna tinta spidol hitam sebenarnya campuran beberapa warna. Ketika air merambat naik pada kertas saring, tiap warna bergerak dengan kecepatan berbeda sehingga terpisah.</p>
<div class="tw"><table>
<thead><tr><th>Cara</th><th>Dasar pemisahan</th><th>Contoh</th></tr></thead>
<tbody>
<tr><td>Penyaringan</td><td>Ukuran butir padatan</td><td>Menyaring santan, air kopi</td></tr>
<tr><td>Penguapan</td><td>Zat terlarut tidak menguap</td><td>Garam dari air laut</td></tr>
<tr><td>Penyulingan</td><td>Titik didih berbeda</td><td>Minyak kayu putih, air suling</td></tr>
<tr><td>Dekantasi</td><td>Endapan turun ke dasar</td><td>Memisahkan air dari endapan tepung</td></tr>
<tr><td>Pengayakan</td><td>Ukuran butiran</td><td>Kerikil dari pasir</td></tr>
<tr><td>Magnet</td><td>Sifat kemagnetan</td><td>Paku dari pasir</td></tr>
<tr><td>Kromatografi</td><td>Kecepatan merambat zat</td><td>Memisahkan warna tinta</td></tr>
</tbody></table></div>
<aside class="box coba"><p>Potong kertas saring atau tisu putih menjadi lajur panjang. Beri titik tinta spidol larut air (hitam atau hijau) sekitar dua sentimeter dari ujung bawah. Celupkan ujung bawah ke dalam air sedikit saja, jangan sampai titik tinta terendam. Tunggu sampai air merambat naik. Warna apa saja yang muncul?</p></aside>`,
      r: `Campuran dipisahkan berdasarkan perbedaan sifat penyusunnya. Cara yang dipakai antara lain penyaringan, penguapan, penyulingan, dekantasi, pengayakan, magnet, dan kromatografi. Pemilihan cara bergantung pada jenis campuran yang dipisahkan.`
    },
    {
      t: "Zat di Sekitar Kita: Asam, Basa, Aditif, dan Zat Berbahaya",
      c: `<p>Di dapur dan kamar mandi rumahmu banyak zat yang bisa digolongkan berdasarkan sifat keasamannya. {{Asam}} biasanya rasanya masam, misalnya jeruk nipis, cuka, tomat, dan jeruk. {{Basa}} biasanya terasa licin di kulit dan agak pahit. Sabun, pasta gigi, dan obat maag termasuk basa. Zat yang tidak asam dan tidak basa disebut {{netral}}, seperti air murni.</p>
<p>Namun, jangan sekali-kali mencicipi zat yang tidak kamu kenal hanya untuk mengetahui sifatnya. Para ilmuwan memakai {{indikator}}, yaitu zat yang berubah warna bergantung pada sifat larutan. Contohnya {{kertas lakmus}}. Lakmus biru berubah menjadi merah dalam asam, dan lakmus merah berubah menjadi biru dalam basa. Kita juga bisa memakai indikator alami. Air rebusan kol ungu atau seduhan bunga telang berwarna biru keunguan, lalu berubah merah muda jika ditetesi air jeruk dan berubah kehijauan jika ditetesi larutan sabun.</p>
<p>Di dalam makanan dan minuman yang dijual, sering ditambahkan {{zat aditif}}, yaitu bahan yang sengaja ditambahkan untuk tujuan tertentu. Contohnya pewarna agar tampak menarik, pemanis agar manis, penyedap agar gurih, dan {{pengawet}} agar tidak cepat basi. Zat aditif ada yang alami (kunyit untuk warna kuning, daun suji untuk warna hijau) dan ada yang buatan. Zat aditif boleh dipakai selama jenisnya diizinkan dan jumlahnya sesuai takaran. Bahan seperti {{boraks}} dan {{formalin}} sangat berbahaya bila dicampurkan ke makanan dan dilarang. Biasakan membaca label kemasan dan memilih jajanan yang bersih.</p>
<p>Ada banyak zat berbahaya di rumah, misalnya cairan pembersih lantai, pemutih pakaian, obat nyamuk, bensin, minyak tanah, dan pestisida. Zat itu bisa melukai kulit, merusak mata, atau meracuni bila tertelan atau terhirup. Aturan penggunaannya: baca label dan simbol bahayanya, simpan di tempat tinggi dan tertutup rapat jauh dari jangkauan anak kecil, jangan dipindahkan ke botol bekas minuman, jangan mencampur dua pembersih berbeda, pakailah sarung tangan, dan pastikan ruangan berventilasi baik. Bila terkena kulit atau mata, segera bilas dengan banyak air dan minta tolong orang dewasa.</p>
<div class="tw"><table>
<thead><tr><th>Golongan</th><th>Ciri</th><th>Contoh</th><th>Lakmus</th></tr></thead>
<tbody>
<tr><td>Asam</td><td>Rasa masam</td><td>Jeruk nipis, cuka, tomat</td><td>Biru menjadi merah</td></tr>
<tr><td>Basa</td><td>Licin, agak pahit</td><td>Sabun, pasta gigi</td><td>Merah menjadi biru</td></tr>
<tr><td>Netral</td><td>Tidak asam, tidak basa</td><td>Air murni</td><td>Tidak berubah</td></tr>
</tbody></table></div>
<aside class="box ingat"><p>Tidak semua zat di rumah aman untuk dicicipi atau disentuh. Jangan pernah mencampur pemutih dengan pembersih lain karena dapat menghasilkan gas beracun.</p></aside>
<aside class="box coba"><p>Seduh beberapa bunga telang dengan air panas (minta bantuan orang dewasa) dan tunggu dingin. Bagi menjadi tiga gelas bening. Teteskan air jeruk nipis pada gelas pertama, larutan sabun encer pada gelas kedua, dan biarkan gelas ketiga apa adanya. Amati warna masing-masing. Jangan diminum.</p></aside>`,
      r: `Zat dapat digolongkan menjadi asam, basa, dan netral, dan sifatnya dapat dikenali dengan indikator seperti kertas lakmus atau bunga telang. Zat aditif ditambahkan ke makanan dengan tujuan tertentu, tetapi bahan seperti boraks dan formalin dilarang. Zat berbahaya di rumah harus disimpan dan dipakai dengan hati-hati.`
    }
  ],
  rb: [
    "Zat (materi) menempati ruang dan memiliki massa. Massa diukur dengan neraca, volume dengan gelas ukur.",

  ],
  rf: [
    "Berikan tiga contoh perubahan zat yang kamu lihat di dapur rumahmu. Mana yang termasuk perubahan fisika dan mana yang perubahan kimia? Apa alasannya?",

    { q: "Peristiwa berikut yang merupakan perubahan kimia adalah ...", o: ["Es mencair", "Gula larut dalam air", "Kain digunting", "Kertas dibakar"], a: 3, p: "Kertas yang dibakar menjadi abu dan asap, yaitu zat baru. Tiga pilihan lain tidak membentuk zat baru." },

    { q: "Larutan yang mengubah kertas lakmus biru menjadi merah bersifat ...", o: ["Basa", "Netral", "Asam", "Garam"], a: 2, p: "Lakmus biru berubah menjadi merah dalam larutan asam. Dalam larutan basa, lakmus merah berubah menjadi biru." }
  ]
};
var BAB3 = {
  no: 3,
  judul: "Energi dan Perubahannya",
  desk: "Mengenal sumber dan bentuk energi, bagaimana energi berubah, serta cara menghemat energi untuk masa depan.",
  subs: [
    {
      t: "Pengertian Energi dan Mengapa Energi Penting",
      c: `<p>Saat kamu berlari, kipas angin berputar, atau tanaman tumbuh, ada sesuatu yang membuat semua itu bisa terjadi. Sesuatu itu adalah {{energi}}. Energi adalah kemampuan untuk melakukan {{usaha}}, yaitu menggerakkan, memanaskan, menerangi, atau mengubah sesuatu. Energi tidak bisa dipegang atau dilihat, tetapi kita bisa mengetahuinya dari akibatnya. Ketika lampu menyala, ada energi listrik. Ketika kamu merasa hangat di dekat api, ada energi panas.</p>
<p>Setiap kegiatan membutuhkan energi. Tubuhmu memperoleh energi dari makanan. Nasi, sayur, dan lauk yang kamu santap diolah menjadi tenaga untuk belajar, bermain, dan bernapas. Sepeda motor dan mobil memperoleh energi dari bensin. Televisi, kulkas, dan setrika memperoleh energi dari listrik. Tumbuhan memperoleh energi dari cahaya matahari untuk membuat makanan lewat fotosintesis.</p>
<p>Satuan energi adalah {{joule}} (J). Pada label makanan, kamu mungkin pernah melihat satuan kalori atau kilokalori yang juga mengukur energi. Satu kilokalori kira-kira sama dengan 4.200 joule.</p>
<p>Ada satu aturan penting tentang energi yang disebut {{hukum kekekalan energi}}. Energi tidak bisa diciptakan dan tidak bisa dimusnahkan, tetapi bisa berubah dari satu bentuk ke bentuk lain. Misalnya saat kamu menyalakan lampu, energi listrik berubah menjadi energi cahaya dan sebagian menjadi panas. Energi tidak menghilang, hanya berganti bentuk.</p>
<p>Sumber energi utama bagi bumi adalah matahari. Cahaya matahari menghangatkan bumi, menggerakkan angin, menguapkan air untuk membentuk hujan, dan menjadi bahan dasar fotosintesis tumbuhan. Makanan yang kita makan, batu bara, dan minyak bumi pun pada awalnya bersumber dari energi matahari yang tersimpan dalam makhluk hidup. Bayangkan jika matahari mendadak mati. Bumi akan menjadi gelap dan beku, dan kehidupan tidak akan bertahan.</p>
<aside class="box ingat"><p>Energi tidak dapat diciptakan dan tidak dapat dimusnahkan. Energi hanya berubah bentuk dan berpindah dari satu benda ke benda lain.</p></aside>
<aside class="box coba"><p>Buat daftar lima kegiatan yang kamu lakukan sejak bangun tidur pagi ini. Untuk tiap kegiatan, tulis dari mana energinya berasal. Misalnya menyikat gigi: tenaga dari makanan semalam. Menyalakan lampu: energi listrik dari PLN. Apakah semuanya bisa kamu telusuri?</p></aside>`,
      r: `Energi adalah kemampuan untuk melakukan usaha dan diukur dalam joule. Energi tidak dapat diciptakan atau dimusnahkan, hanya berubah bentuk. Matahari adalah sumber energi utama bagi kehidupan di bumi.`
    },
    {
      t: "Sumber Energi: Terbarukan dan Tak Terbarukan",
      c: `<p>Sumber energi adalah benda atau peristiwa yang dapat menghasilkan energi. Berdasarkan ketersediaannya, sumber energi dibagi menjadi dua kelompok: {{energi tak terbarukan}} dan {{energi terbarukan}}.</p>
<p>Sumber energi tak terbarukan adalah sumber yang jumlahnya terbatas dan tidak dapat digantikan dalam waktu singkat. Yang paling dikenal adalah {{bahan bakar fosil}}, yaitu {{minyak bumi}}, {{batu bara}}, dan {{gas alam}}. Bahan bakar fosil terbentuk dari sisa tumbuhan dan hewan purba yang tertimbun di dalam tanah selama jutaan tahun, tertekan, dan terkena panas bumi. Dari minyak bumi kita memperoleh bensin, solar, dan minyak tanah. Batu bara dipakai untuk membangkitkan listrik. Gas alam menjadi bahan bakar kompor gas elpiji. Karena terbentuknya sangat lama, penggunaan yang berlebihan akan membuat persediaannya habis. Selain itu, pembakarannya menimbulkan asap dan gas yang mencemari udara.</p>
<p>Sumber energi terbarukan adalah sumber yang tersedia terus-menerus di alam atau dapat pulih dalam waktu singkat. Contohnya adalah energi matahari ({{energi surya}}), angin, air, panas bumi, dan biomassa. Energi matahari dapat diubah menjadi listrik oleh panel surya. Angin yang kencang memutar baling-baling kincir untuk menghasilkan listrik. Aliran air sungai atau air di bendungan menggerakkan turbin pada {{PLTA}} atau pembangkit listrik tenaga air.</p>
<p>{{Panas bumi}} adalah panas dari dalam bumi. Karena Indonesia memiliki banyak gunung berapi, potensi panas bumi di negeri kita termasuk yang terbesar di dunia. Uap panas dari dalam tanah dipakai untuk memutar turbin, misalnya di Kamojang, Jawa Barat. {{Biomassa}} adalah bahan dari makhluk hidup yang dapat dibakar atau diolah menjadi energi, seperti kayu bakar, kotoran ternak yang diolah menjadi biogas, dan limbah pertanian. Selama tanaman terus ditanam lagi, biomassa akan selalu tersedia.</p>
<div class="tw"><table>
<thead><tr><th>Kelompok</th><th>Sumber</th><th>Pemanfaatan</th></tr></thead>
<tbody>
<tr><td rowspan="3">Tak terbarukan</td><td>Minyak bumi</td><td>Bensin, solar, minyak tanah</td></tr>
<tr><td>Batu bara</td><td>Pembangkit listrik</td></tr>
<tr><td>Gas alam</td><td>Bahan bakar kompor, industri</td></tr>
<tr><td rowspan="5">Terbarukan</td><td>Matahari</td><td>Panel surya, menjemur pakaian</td></tr>
<tr><td>Angin</td><td>Kincir angin, perahu layar</td></tr>
<tr><td>Air</td><td>PLTA, kincir air</td></tr>
<tr><td>Panas bumi</td><td>Pembangkit listrik panas bumi</td></tr>
<tr><td>Biomassa</td><td>Biogas, kayu bakar</td></tr>
</tbody></table></div>
<aside class="box tahu"><p>Sumber energi terbarukan memang tidak akan habis, tetapi pembangkitnya tetap perlu dibangun dan dirawat. Karena itu, hemat energi tetap penting meskipun sumbernya terbarukan.</p></aside>`,
      r: `Sumber energi tak terbarukan, seperti minyak bumi, batu bara, dan gas alam, jumlahnya terbatas. Sumber energi terbarukan, seperti matahari, angin, air, panas bumi, dan biomassa, tersedia terus-menerus. Penggunaan energi terbarukan lebih ramah lingkungan.`
    },
    {
      t: "Bentuk-bentuk Energi",
      c: `<p>Energi hadir dalam banyak bentuk, dan satu bentuk dapat berubah menjadi bentuk lainnya. Mengenal bentuk-bentuk energi akan membantumu memahami berbagai peristiwa di sekitarmu.</p>
<p>{{Energi kalor}} atau energi panas adalah energi yang membuat benda terasa panas atau hangat. Sumbernya antara lain matahari, api, dan kompor. {{Energi cahaya}} membuat kita bisa melihat. Sumbernya matahari, lampu, dan lilin. {{Energi bunyi}} dihasilkan oleh benda yang bergetar, seperti senar gitar, bedug, dan pita suara. {{Energi listrik}} dihasilkan oleh sumber listrik seperti baterai, aki, dan pembangkit listrik. Energi ini kita pakai setiap hari untuk menyalakan lampu dan alat elektronik.</p>
<p>{{Energi gerak}} atau energi kinetik dimiliki oleh benda yang sedang bergerak. Bola yang menggelinding, mobil yang melaju, dan angin yang bertiup memiliki energi gerak. Makin cepat benda bergerak dan makin besar massanya, makin besar energi geraknya. Truk besar yang melaju kencang punya energi gerak jauh lebih besar daripada sepeda yang melaju pelan.</p>
<p>{{Energi kimia}} tersimpan dalam bahan-bahan tertentu dan baru dilepaskan ketika terjadi perubahan kimia. Makanan, bensin, kayu, baterai, dan gas elpiji menyimpan energi kimia. Ketika makanan dicerna, bahan bakar dibakar, atau baterai dipakai, energi kimia dilepaskan menjadi bentuk energi lain.</p>
<p>{{Energi potensial}} adalah energi yang tersimpan dalam benda karena kedudukan atau keadaannya. Buah kelapa di pohon yang tinggi memiliki energi potensial. Makin tinggi letaknya dan makin besar massanya, makin besar energi potensialnya. Ketika kelapa jatuh, energi potensial berubah menjadi energi gerak. Karet ketapel yang ditarik dan pegas yang ditekan juga menyimpan energi potensial. Air di bendungan yang tinggi memiliki energi potensial yang dimanfaatkan PLTA.</p>
<div class="tw"><table>
<thead><tr><th>Bentuk energi</th><th>Sumber atau ciri</th><th>Contoh</th></tr></thead>
<tbody>
<tr><td>Kalor (panas)</td><td>Matahari, api</td><td>Kompor, setrika</td></tr>
<tr><td>Cahaya</td><td>Matahari, lampu</td><td>Senter, layar ponsel</td></tr>
<tr><td>Bunyi</td><td>Benda bergetar</td><td>Gitar, bedug, speaker</td></tr>
<tr><td>Listrik</td><td>Baterai, pembangkit</td><td>Lampu, televisi</td></tr>
<tr><td>Gerak (kinetik)</td><td>Benda yang bergerak</td><td>Sepeda melaju, angin</td></tr>
<tr><td>Kimia</td><td>Zat yang menyimpan energi</td><td>Makanan, bensin, baterai</td></tr>
<tr><td>Potensial</td><td>Kedudukan atau bentuk benda</td><td>Kelapa di pohon, ketapel ditarik</td></tr>
</tbody></table></div>
<aside class="box coba"><p>Ikat sebuah benda kecil pada tali sepanjang satu meter dan ayunkan seperti bandul. Di titik tertinggi, benda berhenti sejenak dan memiliki energi potensial terbesar. Di titik terendah, benda bergerak paling cepat dan memiliki energi gerak terbesar. Perhatikan bagaimana kedua energi itu bergantian.</p></aside>`,
      r: `Bentuk-bentuk energi meliputi kalor, cahaya, bunyi, listrik, gerak, kimia, dan potensial. Energi gerak dimiliki benda yang bergerak, sedangkan energi potensial tersimpan karena kedudukan atau keadaan benda. Makanan, bensin, dan baterai menyimpan energi kimia.`
    },
    {
      t: "Perubahan Bentuk Energi",
      c: `<p>Hampir semua alat yang kita pakai bekerja dengan mengubah satu bentuk energi menjadi bentuk lain. Peristiwa ini disebut {{perubahan energi}}. Sebuah alat yang menerima energi listrik, misalnya, bisa mengubahnya menjadi cahaya, gerak, panas, atau bunyi tergantung fungsi alat itu.</p>
<p>Pada kipas angin, energi listrik berubah menjadi energi gerak yang memutar baling-baling. Pada lampu, energi listrik berubah menjadi energi cahaya dan sebagian menjadi energi panas. Pada kompor gas, energi kimia dari gas elpiji berubah menjadi energi panas dan cahaya api. Pada baterai senter, energi kimia dalam baterai berubah menjadi energi listrik, lalu menjadi energi cahaya pada lampu senter. Pada pengeras suara, energi listrik berubah menjadi energi bunyi. Pada setrika, energi listrik berubah menjadi energi panas.</p>
<p>{{Panel surya}} adalah alat yang mengubah energi cahaya matahari menjadi energi listrik. Alat ini dipakai pada lampu jalan tenaga surya dan kalkulator bertenaga surya. Pada tumbuhan, energi cahaya diubah menjadi energi kimia berupa makanan lewat fotosintesis. Tubuh kita mengubah energi kimia dari makanan menjadi energi gerak, energi panas (karena itu tubuh hangat), dan energi lain.</p>
<p>Contoh perubahan energi yang lebih panjang terjadi di {{PLTA}}. Air yang tertahan di bendungan tinggi memiliki energi potensial. Saat air dialirkan turun, energi potensial berubah menjadi energi gerak yang memutar {{turbin}}. Turbin memutar {{generator}}, yaitu alat yang mengubah energi gerak menjadi energi listrik. Listrik itu kemudian dialirkan melalui kabel ke rumah-rumah.</p>
<figure class="fig"><div class="chain"><div class="nd">Air di bendungan<small>energi potensial</small></div><span class="ar" aria-hidden="true">&rarr;</span><div class="nd">Turbin berputar<small>energi gerak</small></div><span class="ar" aria-hidden="true">&rarr;</span><div class="nd">Generator<small>energi listrik</small></div><span class="ar" aria-hidden="true">&rarr;</span><div class="nd">Lampu di rumah<small>energi cahaya</small></div></div><div class="cap">Rantai perubahan energi pada pembangkit listrik tenaga air.</div></figure>
<div class="tw"><table>
<thead><tr><th>Alat</th><th>Energi awal</th><th>Energi hasil yang diinginkan</th></tr></thead>
<tbody>
<tr><td>Kipas angin</td><td>Listrik</td><td>Gerak</td></tr>
<tr><td>Lampu</td><td>Listrik</td><td>Cahaya (dan panas)</td></tr>
<tr><td>Kompor gas</td><td>Kimia</td><td>Panas dan cahaya</td></tr>
<tr><td>Baterai</td><td>Kimia</td><td>Listrik</td></tr>
<tr><td>Panel surya</td><td>Cahaya</td><td>Listrik</td></tr>
<tr><td>Speaker</td><td>Listrik</td><td>Bunyi</td></tr>
</tbody></table></div>
<aside class="box ingat"><p>Hampir setiap perubahan energi menghasilkan sebagian energi panas yang tidak dikehendaki. Lampu pijar mengubah sebagian besar energinya menjadi panas, itulah sebabnya terasa hangat bila disentuh. Lampu LED lebih hemat karena lebih banyak energi menjadi cahaya.</p></aside>`,
      r: `Alat-alat bekerja dengan mengubah satu bentuk energi menjadi bentuk lain, misalnya kipas angin mengubah listrik menjadi gerak. Panel surya mengubah cahaya menjadi listrik, sedangkan PLTA mengubah energi potensial air menjadi gerak lalu menjadi listrik. Selalu ada sebagian energi yang berubah menjadi panas.`
    },
    {
      t: "Energi Panas: Suhu dan Perpindahan Kalor",
      c: `<p>Ketika kamu menyentuh segelas air panas dan segelas air es, kamu bisa merasakan perbedaannya. Ukuran derajat panas atau dinginnya benda disebut {{suhu}}. Suhu diukur dengan {{termometer}} dalam satuan derajat Celcius (°C). Air membeku pada 0 °C dan mendidih pada 100 °C, sedangkan suhu tubuh manusia yang sehat kira-kira 37 °C. Suhu bukan sama dengan kalor. Kalor adalah energi panas yang berpindah, sedangkan suhu hanya menunjukkan seberapa panas benda itu.</p>
<p>Kalor selalu berpindah dari benda bersuhu tinggi ke benda bersuhu rendah sampai suhu keduanya sama. Es teh akan menjadi hangat jika dibiarkan lama di ruangan karena kalor dari udara berpindah ke minuman. Perpindahan kalor terjadi melalui tiga cara.</p>
<p>{{Konduksi}} adalah perpindahan kalor melalui zat padat tanpa disertai perpindahan bagian-bagian zatnya. Jika ujung sendok besi dicelupkan ke dalam sup panas, bagian pegangannya ikut menjadi hangat. Kalor merambat dari partikel ke partikel. {{Konveksi}} adalah perpindahan kalor melalui zat cair atau gas yang disertai perpindahan bagian zat tersebut. Saat air direbus, air panas di bawah naik karena menjadi lebih ringan, dan air dingin di atas turun, lalu bergantian terus-menerus. Konveksi juga terjadi pada angin laut dan angin darat. {{Radiasi}} adalah perpindahan kalor tanpa zat perantara. Panas matahari sampai ke bumi lewat ruang hampa antariksa dengan cara ini. Kamu juga merasakan hangat dari api unggun walaupun tidak menyentuhnya.</p>
<p>Bahan yang mudah menghantarkan panas disebut {{konduktor}} kalor, seperti logam (besi, aluminium, tembaga). Itulah sebabnya panci dibuat dari logam. Bahan yang sulit menghantarkan panas disebut {{isolator}} kalor, seperti kayu, plastik, dan karet. Gagang panci dan sendok sayur dibuat dari plastik atau kayu agar tangan tidak terbakar.</p>
<div class="tw"><table>
<thead><tr><th>Cara</th><th>Terjadi pada</th><th>Contoh</th></tr></thead>
<tbody>
<tr><td>Konduksi</td><td>Zat padat</td><td>Sendok logam di panci panas</td></tr>
<tr><td>Konveksi</td><td>Zat cair dan gas</td><td>Air mendidih, asap naik, angin laut</td></tr>
<tr><td>Radiasi</td><td>Tanpa zat perantara</td><td>Panas matahari, api unggun</td></tr>
</tbody></table></div>
<aside class="box coba"><p>Dengan bantuan orang dewasa, siapkan segelas air hangat (jangan sampai panas mendidih). Masukkan sendok logam, sendok kayu, dan sendok plastik secara bersamaan. Setelah dua menit, sentuh bagian atas gagang masing-masing. Sendok mana yang terasa paling hangat? Apa artinya bagi konduktor dan isolator?</p></aside>`,
      r: `Suhu menunjukkan derajat panas benda dan diukur dengan termometer. Kalor berpindah dari benda bersuhu tinggi ke rendah melalui konduksi, konveksi, dan radiasi. Konduktor menghantarkan panas dengan baik, sedangkan isolator tidak.`
    },
    {
      t: "Energi Cahaya: Sifat, Pemantulan, dan Pembiasan",
      c: `<p>Tanpa cahaya, kita tidak dapat melihat apa pun. Kita melihat benda karena benda itu memancarkan cahaya sendiri, seperti matahari dan lampu, atau memantulkan cahaya yang mengenainya. Benda yang memancarkan cahaya sendiri disebut sumber cahaya. Benda lain, seperti buku dan pohon, terlihat karena cahaya dari sumber memantul dari permukaannya ke mata kita.</p>
<p>Cahaya merambat lurus. Karena itu sinar senter terlihat seperti garis lurus di ruangan berdebu. Jika cahaya terhalang benda, terbentuk bayangan di belakang benda itu. Cahaya merambat sangat cepat, sekitar 300.000 kilometer per detik. Sinar matahari memerlukan sekitar delapan menit untuk tiba di bumi.</p>
<p>Benda dibedakan menurut cara mereka meneruskan cahaya. Benda tembus cahaya (bening), seperti kaca jendela dan plastik bening, meneruskan hampir semua cahaya. Benda yang meneruskan sebagian cahaya, seperti kertas minyak, tampak buram. Benda tidak tembus cahaya, seperti kayu, tembok, dan buku, tidak meneruskan cahaya sehingga membentuk bayangan gelap.</p>
<p>{{Pemantulan}} adalah peristiwa cahaya memantul ketika mengenai permukaan benda. Pada cermin datar, sudut sinar datang sama dengan sudut sinar pantul. Bayangan pada cermin datar sama besar dengan bendanya, tampak seperti berada di belakang cermin, dan sisi kanan-kirinya tertukar. Permukaan yang halus dan mengilap memantulkan cahaya secara teratur seperti cermin, sedangkan permukaan kasar memantulkan cahaya ke segala arah sehingga tidak membentuk bayangan jelas.</p>
<p>{{Pembiasan}} adalah pembelokan arah cahaya ketika melewati dua zat bening yang berbeda, misalnya dari udara ke air. Karena pembiasan, sedotan yang dicelupkan ke dalam gelas berisi air tampak patah. Kolam juga tampak lebih dangkal daripada kedalaman sebenarnya. Lensa kacamata dan lensa kamera memanfaatkan pembiasan. Pelangi muncul ketika cahaya matahari dibiaskan dan diuraikan oleh butiran air hujan menjadi warna merah, jingga, kuning, hijau, biru, nila, dan ungu, yang sering diingat sebagai “mejikuhibiniu”.</p>
<div class="tw"><table>
<thead><tr><th>Peristiwa</th><th>Penyebab</th><th>Contoh</th></tr></thead>
<tbody>
<tr><td>Pemantulan</td><td>Cahaya mengenai permukaan benda</td><td>Cermin, genangan air yang tenang</td></tr>
<tr><td>Pembiasan</td><td>Cahaya pindah antara dua zat bening</td><td>Sedotan tampak patah, lensa</td></tr>
<tr><td>Bayangan</td><td>Cahaya terhalang benda tak tembus cahaya</td><td>Bayangan pohon di siang hari</td></tr>
</tbody></table></div>
<aside class="box tahu"><p>Matahari jauh sekali dari bumi, tetapi cahayanya cukup cepat sampai dalam waktu sekitar delapan menit. Seandainya matahari mendadak padam, kita baru akan tahu delapan menit kemudian.</p></aside>
<aside class="box coba"><p>Letakkan sebuah koin di dasar mangkuk kosong. Mundurlah sampai koin itu tepat tidak terlihat karena terhalang tepi mangkuk. Mintalah temanmu menuang air perlahan ke dalam mangkuk tanpa menggeser koin. Apa yang terjadi? Cahaya yang dibiaskan membuat koin muncul kembali.</p></aside>`,
      r: `Cahaya merambat lurus dan dapat membentuk bayangan. Benda dibedakan menjadi tembus cahaya dan tidak tembus cahaya. Cahaya dapat dipantulkan oleh cermin dan dibiaskan ketika berpindah antara dua zat bening, seperti dari udara ke air.`
    },
    {
      t: "Energi Bunyi dan Energi Listrik",
      c: `<p>Bunyi berasal dari benda yang bergetar. Jika kamu menyentuh leher saat berbicara, kamu bisa merasakan getaran pita suara. Senar gitar yang dipetik, kulit bedug yang dipukul, dan garpu tala yang diketuk semuanya bergetar. Getaran itu merambat ke telinga kita lewat perantara udara, air, atau benda padat. Bunyi tidak dapat merambat di ruang hampa karena tidak ada zat perantara. Di udara, bunyi merambat dengan kecepatan sekitar 340 meter per detik, lebih lambat daripada cahaya. Karena itu, kita melihat kilat lebih dulu daripada mendengar guntur. Bunyi merambat lebih cepat pada zat padat dan zat cair daripada di udara.</p>
<p>Bunyi bisa keras atau pelan, dan tinggi atau rendah. Bunyi menjadi keras jika getarannya kuat, dan nada menjadi tinggi jika getarannya cepat. Bunyi dapat dipantulkan. Bunyi yang dipantulkan dinding gua atau tebing terdengar sebagai gema. Kelelawar memanfaatkan pantulan bunyi untuk mengenali benda di sekitarnya pada malam hari. Jagalah telingamu dari bunyi terlalu keras, misalnya dengan mengecilkan volume earphone.</p>
<p>Energi listrik dapat mengalir lewat kabel sebagai {{arus listrik}}. Agar arus mengalir, diperlukan rangkaian tertutup yang terdiri atas sumber listrik (baterai), penghantar (kabel), dan beban (lampu). Saklar berfungsi membuka dan menutup rangkaian. Jika rangkaian terputus, lampu padam.</p>
<p>Ada dua cara menyusun lampu dalam rangkaian. Pada {{rangkaian seri}}, lampu dipasang berderet dalam satu jalur. Bila satu lampu putus, semua lampu padam, dan makin banyak lampu, nyalanya makin redup. Pada {{rangkaian paralel}}, lampu dipasang pada jalur bercabang. Bila satu lampu putus, lampu lainnya tetap menyala. Listrik di rumah dipasang secara paralel agar tiap alat bisa dipakai sendiri-sendiri.</p>

</div><div class="cap">Garis ganda di sisi kiri adalah baterai. Pada rangkaian seri hanya ada satu jalur arus, sedangkan pada rangkaian paralel arus punya dua jalur.</div></figure>
<p>Bahan yang mudah dialiri listrik disebut konduktor, misalnya tembaga, aluminium, dan besi. Bahan yang sulit dialiri listrik disebut isolator, misalnya karet, plastik, kayu kering, dan kaca. Kabel listrik terdiri atas kawat tembaga di dalam dan selubung plastik di luar agar aman. Listrik berbahaya. Jangan memasukkan benda logam ke lubang stopkontak, jangan menyentuh alat listrik dengan tangan basah, dan jauhi kabel yang terkelupas.</p>
<aside class="box ingat"><p>Jangan pernah bereksperimen dengan listrik rumah (PLN). Untuk percobaan, gunakan baterai kecil dan didampingi orang dewasa.</p></aside>`,
      r: `Bunyi dihasilkan oleh benda yang bergetar dan memerlukan zat perantara untuk merambat. Arus listrik mengalir dalam rangkaian tertutup. Pada rangkaian seri hanya ada satu jalur arus, sedangkan pada rangkaian paralel arus punya jalur bercabang sehingga tiap lampu dapat menyala sendiri.`

    {
      t: "Hemat Energi dan Energi untuk Masa Depan",
      c: `<p>Setiap hari manusia memakai energi dalam jumlah sangat besar. Sebagian besar listrik di Indonesia saat ini masih dihasilkan dari pembakaran batu bara, dan kendaraan memakai bahan bakar dari minyak bumi. Penggunaan bahan bakar fosil menimbulkan dua masalah. Pertama, persediaannya terbatas dan suatu saat akan habis. Kedua, pembakarannya melepaskan asap dan gas karbon dioksida. Karbon dioksida termasuk {{gas rumah kaca}}, yaitu gas yang menahan panas matahari di atmosfer. Bila jumlahnya berlebihan, suhu bumi meningkat. Gejala ini disebut {{pemanasan global}}, yang dapat mengubah iklim, mencairkan es di kutub, dan menaikkan permukaan laut.</p>
<p>Karena itu kita perlu melakukan {{hemat energi}}. Kebiasaan sederhana di rumah dan sekolah bisa memberi dampak besar bila dilakukan banyak orang. Matikan lampu, kipas, dan televisi ketika tidak dipakai. Cabut charger dari stopkontak setelah selesai mengisi daya. Manfaatkan cahaya matahari di siang hari dengan membuka tirai dan jendela. Gunakan lampu hemat energi seperti {{LED}}. Jangan membuka pintu kulkas terlalu lama. Pakailah air secukupnya karena memompa air juga membutuhkan listrik. Untuk jarak dekat, berjalan kaki atau bersepeda lebih hemat energi daripada naik kendaraan bermotor, dan naik kendaraan umum lebih hemat daripada naik kendaraan pribadi sendirian.</p>
<p>Selain berhemat, kita perlu beralih ke energi terbarukan. Di Indonesia sudah ada banyak contohnya. PLTA Jatiluhur, Cirata, dan Saguling di Jawa Barat memanfaatkan air. PLTP Kamojang di Jawa Barat dan pembangkit panas bumi lainnya memanfaatkan uap dari dalam bumi. PLTB Sidrap di Sulawesi Selatan memanfaatkan kincir angin. Di Waduk Cirata dibangun {{PLTS}} terapung, yaitu panel surya yang mengapung di atas air. Di beberapa desa, sungai kecil dimanfaatkan untuk pembangkit listrik mikrohidro yang membuat lampu rumah penduduk menyala. Solar juga dicampur minyak kelapa sawit menjadi biodiesel, sehingga sebagian bahan bakar berasal dari tanaman.</p>
<p>Energi masa depan masih terus dikembangkan, misalnya kendaraan listrik, baterai penyimpan listrik yang lebih awet, dan pemanfaatan gelombang laut. Anak-anak masa kini akan menjadi penemu dan pengguna teknologi itu. Mulailah dari kebiasaan kecil hari ini agar bumi tetap nyaman bagi generasi berikutnya.</p>

<thead><tr><th>Di mana</th><th>Kebiasaan hemat energi</th></tr></thead>

<tr><td>Di jalan</td><td>Berjalan kaki, bersepeda, naik kendaraan umum</td></tr>
<tr><td>Di dapur</td><td>Tutup panci saat memasak, jangan lama membuka kulkas</td></tr>
</tbody></table></div>
<aside class="box coba"><p>Bersama keluargamu, tempel catatan kecil “Matikan lampu!” di dekat saklar. Selama satu minggu, hitung berapa kali lampu yang tidak dipakai berhasil dimatikan. Apakah kebiasaan barumu berhasil?</p></aside>`,

      applyTheme(nt);
      try { localStorage.setItem('ipas.theme', nt); } catch (er) {}
      el.textContent = isDark() ? 'Terang' : 'Gelap';
      return;
    }
    if (el.id === 'reset') {
      if (el.getAttribute('data-armed')) {
        clearTimeout(resetTimer);
        store = { read: {}, quiz: {} }; save();
        go('home');
      } else {
        el.setAttribute('data-armed', '1');
        el.textContent = 'Klik sekali lagi untuk menghapus';
        resetTimer = setTimeout(function () { el.removeAttribute('data-armed'); el.textContent = 'Hapus progres belajar'; }, 4000);
      }
      return;
    }
    if (el.hasAttribute('data-letter')) {
      var tg = document.getElementById('gl-' + el.getAttribute('data-letter'));
      if (tg) tg.scrollIntoView({ behavior: 'smooth', block: 'start' });
      return;
    }
    if (el.hasAttribute('data-opt')) { quizAction('opt', el); return; }
    if (el.hasAttribute('data-q')) { quizAction(el.getAttribute('data-q'), el); return; }
    if (el.hasAttribute('data-go')) { go(el.getAttribute('data-go') === 'glos' ? 'glos' : 'home'); return; }
    if (el.hasAttribute('data-open')) {
      var parts = el.getAttribute('data-open').split(',');
      var nb = parseInt(parts[0], 10), ni = parseInt(parts[1], 10);
      if (S.view === 'bab' && S.item < BABS[S.bab].subs.length && (el.className.indexOf('pg') > -1)) markRead(sid(BABS[S.bab], S.item));
      go('bab', nb, ni);
    }
  });
  document.addEventListener('input', function (e) {
    if (e.target && e.target.id === 'gq') {
      glQuery = e.target.value;
      var l = document.getElementById('gl-list');
      if (l) l.innerHTML = glList(glQuery);
    }
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') hidePop();
    if ((e.key === 'Enter' || e.key === ' ') && e.target && e.target.classList && e.target.classList.contains('t')) {
      e.preventDefault(); showPop(e.target);
    }
  });

  render();
  onScroll();
})();

</script>

</body></html>
